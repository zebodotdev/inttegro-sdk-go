name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zebodotdev/inttegro-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: d8e3b5ab2ac0d24d9edb4a24fdad7b9815cc803b
          path: openapi
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify the release tag, module, and runtime version
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' version.go)"
          test "${GITHUB_REF_NAME}" = "v${runtime_version}"
          test "$(go list -m)" = "github.com/zebodotdev/inttegro-sdk-go/v4"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Run the release checks
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "${unformatted}"
          GOWORK=off go vet ./...
          GOWORK=off go test ./... -race

      - name: Archive the exact tagged module source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          git archive --format=tar --prefix="inttegro-sdk-go-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "artifacts/inttegro-sdk-go-${version}.tar.gz"

      - name: Attest the module source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATION.sigstore.jsonl
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
            echo "module=github.com/zebodotdev/inttegro-sdk-go/v4"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum ./*.tar.gz ./ATTESTATION.sigstore.jsonl ./PROVENANCE.txt > SHA256SUMS
          )

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --generate-notes
          --title "Inttegro Go SDK ${GITHUB_REF_NAME}"
          --verify-tag
